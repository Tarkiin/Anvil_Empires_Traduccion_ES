name: Publicar instalador descargable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version de la Release (por ejemplo, v0.3.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publicar:
    name: Crear Release y adjuntar el BAT
    runs-on: windows-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Validar los archivos publicados
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'Instalar_Traduccion.bat',
            'Instalar_Online.ps1',
            'Instalar_Traduccion.ps1',
            'AnvilSpanish_P.pak',
            'SHA256SUMS.txt'
          )

          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Falta el archivo requerido: $path"
            }
          }

          foreach ($script in @('Instalar_Online.ps1', 'Instalar_Traduccion.ps1')) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              throw "$script contiene errores de sintaxis."
            }
          }

          $manifest = (Get-Content -LiteralPath 'SHA256SUMS.txt' -Raw).Trim()
          if ($manifest -notmatch '^([0-9A-Fa-f]{64})\s+AnvilSpanish_P\.pak$') {
            throw 'SHA256SUMS.txt no tiene el formato esperado.'
          }
          $expected = $Matches[1].ToUpperInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath 'AnvilSpanish_P.pak').Hash
          if ($actual -ne $expected) {
            throw "El hash del PAK no coincide. Esperado: $expected; obtenido: $actual"
          }

      - name: Crear o actualizar la Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:INPUT_TAG.Trim() }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Etiqueta no valida: $tag"
          }

          $asset = 'Instalar_Traduccion.bat'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber
          }
          else {
            gh release create $tag $asset `
              --target $env:GITHUB_SHA `
              --title "Traduccion de Anvil Empires $tag" `
              --generate-notes `
              --latest
          }

          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub no pudo publicar la Release.'
          }

          Write-Host 'Descarga estable:'
          Write-Host 'https://github.com/Tarkiin/Anvil_Empires_Traduccion_ES/releases/latest/download/Instalar_Traduccion.bat'
